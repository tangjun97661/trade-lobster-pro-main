name: Build Xu Zhengheng Voice Assets
on:
  push:
    branches:
      - chatgpt-temp-biaochang-ep1-voice
    paths:
      - ".github/workflows/relay-biaochang-ep1-voice.yml"
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install
        run: |
          python -m pip install edge-tts
          sudo apt-get update
          sudo apt-get install -y ffmpeg
      - name: Generate
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          python -m edge_tts --voice zh-CN-YunjianNeural --rate=-8% --pitch=-4Hz --text "我是许正衡。先把事实弄清楚，再谈怎么处理。" --write-media out/a.mp3
          python -m edge_tts --voice zh-CN-YunjianNeural --rate=-8% --pitch=-4Hz --text "这个问题不能含糊。涉及评审纪律，就按程序来。" --write-media out/b.mp3
          python -m edge_tts --voice zh-CN-YunjianNeural --rate=-8% --pitch=-4Hz --text "先看事实，再看规则。程序该怎么走，就怎么走。" --write-media out/c.mp3
          python -m edge_tts --voice zh-CN-YunjianNeural --rate=-8% --pitch=-4Hz --text "我是许正衡。先把事实弄清楚，再谈怎么处理。这个问题不能含糊。涉及评审纪律，就按程序来。先看事实，再看规则。程序该怎么走，就怎么走。工作可以讲效率，但边界必须清楚。遇到拿不准的事，不猜，不绕，按程序核实。" --write-media out/d.mp3
          ffmpeg -y -hide_banner -loglevel error -i out/a.mp3 -af "highpass=f=70,lowpass=f=14500,loudnorm=I=-18:LRA=7:TP=-2" -ar 48000 -ac 1 out/sample_intro.wav
          ffmpeg -y -hide_banner -loglevel error -i out/b.mp3 -af "highpass=f=70,lowpass=f=14500,loudnorm=I=-18:LRA=7:TP=-2" -ar 48000 -ac 1 out/sample_warning.wav
          ffmpeg -y -hide_banner -loglevel error -i out/c.mp3 -af "highpass=f=70,lowpass=f=14500,loudnorm=I=-18:LRA=7:TP=-2" -ar 48000 -ac 1 out/sample_reasoning.wav
          ffmpeg -y -hide_banner -loglevel error -i out/d.mp3 -af "highpass=f=70,lowpass=f=14500,loudnorm=I=-18:LRA=7:TP=-2" -ar 48000 -ac 1 out/voice_reference.wav
          rm out/*.mp3
      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: CAST-XZH-001-voice-v0.1
          path: out/*.wav
          retention-days: 1
# xzh voice build 1
