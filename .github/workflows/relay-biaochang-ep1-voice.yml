name: Build Biaochang EP1 Natural Voice
on:
  push:
    branches:
      - chatgpt-temp-biaochang-ep1-voice
    paths:
      - ".github/workflows/relay-biaochang-ep1-voice.yml"
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install speech and audio tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install edge-tts
          sudo apt-get update
          sudo apt-get install -y ffmpeg
      - name: Generate natural Mandarin dialogue
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out/raw out/fit
          python -m edge_tts --voice zh-CN-XiaoyiNeural --rate=-2% --pitch=+0Hz --text "沈老师，有人托我转句话。评标时，对某公司……多关注一下。" --write-media out/raw/01.mp3
          python -m edge_tts --voice zh-CN-YunjianNeural --rate=-5% --pitch=-3Hz --text "公司名都说了。这个‘公平’……方向感挺强。" --write-media out/raw/02.mp3
          python -m edge_tts --voice zh-CN-XiaoyiNeural --rate=-1% --pitch=+0Hz --text "您不收礼、不答应，也不能继续评？" --write-media out/raw/03.mp3
          python -m edge_tts --voice zh-CN-YunjianNeural --rate=-4% --pitch=-3Hz --text "问题不在收没收。评标前有人指定关注对象，先留证，马上报告。" --write-media out/raw/04.mp3
          python -m edge_tts --voice zh-CN-YunyangNeural --rate=-5% --pitch=-4Hz --text "对。是否回避或更换，由组织方依规研判。" --write-media out/raw/05.mp3
          python -m edge_tts --voice zh-CN-YunyangNeural --rate=-4% --pitch=-4Hz --text "不能靠一句‘我没受影响’，替代程序。" --write-media out/raw/06.mp3
          python -m edge_tts --voice zh-CN-YunjianNeural --rate=-5% --pitch=-3Hz --text "我报告情况，请组织方决定。" --write-media out/raw/07.mp3
          python -m edge_tts --voice zh-CN-XiaoxiaoNeural --rate=+1% --pitch=+0Hz --text "情况已登记。经研判，更换专家，替补抽取完成。" --write-media out/raw/08.mp3
          python -m edge_tts --voice zh-CN-XiaoyiNeural --rate=-1% --pitch=+0Hz --text "一条消息，少评一个项目？" --write-media out/raw/09.mp3
          python -m edge_tts --voice zh-CN-YunjianNeural --rate=-5% --pitch=-3Hz --text "不是少评一个项目。" --write-media out/raw/10.mp3
          python -m edge_tts --voice zh-CN-YunyangNeural --rate=-4% --pitch=-4Hz --text "是少欠一个人情。人情上的便宜，最后都得还。" --write-media out/raw/11.mp3
          python -m edge_tts --voice zh-CN-XiaoxiaoNeural --rate=+1% --pitch=+0Hz --text "评标室准备好了，手机请存放。" --write-media out/raw/12.mp3
          python -m edge_tts --voice zh-CN-YunjianNeural --rate=-5% --pitch=-3Hz --text "正好。人情留外面，规则带进去。" --write-media out/raw/13.mp3

          python - <<'PY'
          import subprocess, json, math
          from pathlib import Path

          starts = [2.50,8.30,13.80,17.80,24.80,29.80,34.00,37.20,43.50,46.50,49.00,53.50,56.50]
          ends   = [8.15,13.65,17.65,24.65,29.65,33.85,37.05,43.35,46.35,48.85,53.35,56.35,59.00]

          def duration(p):
              x=subprocess.check_output([
                  "ffprobe","-v","error","-show_entries","format=duration",
                  "-of","default=nw=1:nk=1",str(p)
              ], text=True).strip()
              return float(x)

          for i,(s,e) in enumerate(zip(starts,ends),1):
              src=Path(f"out/raw/{i:02d}.mp3")
              dst=Path(f"out/fit/{i:02d}.wav")
              d=duration(src)
              target=e-s
              # Only accelerate when necessary. Preserve natural phrasing whenever it already fits.
              filters=["aresample=48000"]
              if d > target:
                  factor=d/target
                  # atempo accepts 0.5..2.0, factor here is expected to be mild.
                  filters.insert(0,f"atempo={factor:.6f}")
              filters += ["highpass=f=70","lowpass=f=14500","loudnorm=I=-18:LRA=7:TP=-2"]
              subprocess.run([
                  "ffmpeg","-y","-hide_banner","-loglevel","error","-i",str(src),
                  "-af",",".join(filters),"-ac","1",str(dst)
              ],check=True)

          # Build 62-second timeline. Each utterance is delayed to its scene cue.
          cmd=["ffmpeg","-y","-hide_banner","-loglevel","error"]
          for i in range(1,14):
              cmd += ["-i",f"out/fit/{i:02d}.wav"]
          fc=[]
          labels=[]
          for idx,s in enumerate(starts):
              ms=round(s*1000)
              fc.append(f"[{idx}:a]adelay={ms}|{ms}[a{idx}]")
              labels.append(f"[a{idx}]")
          fc.append("".join(labels)+f"amix=inputs=13:duration=longest:dropout_transition=0,acompressor=threshold=-20dB:ratio=2.5:attack=10:release=120,alimiter=limit=0.93,apad=pad_dur=62,atrim=0:62[dialogue]")
          cmd += ["-filter_complex",";".join(fc),"-map","[dialogue]","-c:a","pcm_s16le","out/dialogue.wav"]
          subprocess.run(cmd,check=True)

          # Add extremely subtle room tone, so cuts do not sound digitally dead.
          subprocess.run([
              "ffmpeg","-y","-hide_banner","-loglevel","error",
              "-f","lavfi","-i","anoisesrc=color=pink:amplitude=0.0025:d=62:r=48000",
              "-i","out/dialogue.wav",
              "-filter_complex","[0:a]lowpass=f=9000,volume=0.20[room];[1:a]volume=1.0[vox];[room][vox]amix=inputs=2:duration=longest:normalize=0,loudnorm=I=-16:LRA=8:TP=-1.5[a]",
              "-map","[a]","-c:a","aac","-b:a","160k","out/dialogue_mix.m4a"
          ],check=True)
          PY
      - name: Upload natural voice track
        uses: actions/upload-artifact@v4
        with:
          name: biaochang-ep1-natural-voice
          path: |
            out/dialogue_mix.m4a
            out/dialogue.wav
          retention-days: 1
